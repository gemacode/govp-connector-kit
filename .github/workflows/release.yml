name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack
      - name: Create GitHub release
        run: |
          for attempt in 1 2 3; do
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ./*.tgz && exit 0
            sleep $((attempt * 5))
          done
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
